<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer une surprise - LoveCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- QR Code uniquement -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        /* FORCE TEXTE NOIR */
        input, textarea, select {
            color: #1f2937 !important;
            background-color: white !important;
            border: 1px solid #d1d5db !important;
        }
        input::placeholder, textarea::placeholder {
            color: #9ca3af !important;
        }
        
        /* Animation QR Code */
        @keyframes qr-appear {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .qr-appear {
            animation: qr-appear 0.5s ease-out;
        }
        
        /* Animation cœur */
        @keyframes float-heart {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        .animate-float-heart {
            animation: float-heart 3s ease-in-out infinite;
        }
        
        /* Style pour indice */
        .hint-section {
            border-left: 4px solid #f59e0b;
            background: linear-gradient(to right, #fef3c7, #fefce8);
        }
        
        /* Template cards */
        .template-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .template-card:hover {
            transform: translateY(-3px);
        }
        .template-card.selected {
            border-width: 3px !important;
            transform: scale(1.05);
        }
        
        /* Bouton magique */
        .btn-magic {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            background-size: 200% 200%;
            animation: gradient-shift 3s ease infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Cœurs flottants */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        /* Loader dots */
        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }
        .loading-dots div {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #8b5cf6;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots div:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots div:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-purple-50 to-pink-50">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="dashboard.html" class="flex-shrink-0 flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-600 to-pink-600 flex items-center justify-center overflow-hidden mr-3 border-2 border-white shadow-lg animate-float-heart">
                            <img src="assets/logo.png" alt="LoveCraft Logo" class="w-full h-full object-cover p-0.5">
                        </div>
                        <span class="text-xl font-bold text-purple-600">LoveCraft</span>
                    </a>
                </div>
                <div class="flex items-center">
                    <a href="dashboard.html" class="text-gray-700 hover:text-purple-600 px-3 py-2 rounded-md text-sm font-medium hover:bg-purple-50 transition">
                        <i class="fas fa-arrow-left mr-1"></i>Retour
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div id="app" class="flex-grow max-w-6xl mx-auto px-4 md:px-8 py-8 w-full">
        <!-- Loader -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block">
                <div class="w-16 h-16 bg-gradient-to-r from-purple-600 to-pink-600 rounded-full flex items-center justify-center mb-4 mx-auto animate-pulse">
                    <i class="fas fa-heart text-white text-2xl"></i>
                </div>
            </div>
            <p class="text-gray-600">Chargement du créateur...</p>
            <div class="loading-dots">
                <div></div><div></div><div></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="text-center">
                <p class="text-gray-400 text-sm">© 2025 LoveCraft - Fait avec ❤️</p>
            </div>
        </div>
    </footer>

    <!-- Auth check + chargement creator.js -->
    <script type="module">
        import { auth, onAuthStateChanged } from './js/firebase.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            // Cacher le loader
            const loader = document.getElementById('loading');
            if (loader) loader.style.display = 'none';

            // Charger creator.js dynamiquement
            import('./js/creator.js').then(module => {
                if (module.default) {
                    new module.default(user.uid);
                }
            }).catch(error => {
                console.error('Erreur creator.js:', error);
                if (loader) loader.style.display = 'none';
                document.getElementById('app').innerHTML = `
                    <div class="text-center py-12">
                        <div class="text-5xl mb-4">😢</div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">Erreur de chargement</h2>
                        <p class="text-gray-600 mb-2">Impossible de charger le créateur.</p>
                        <p class="text-gray-400 text-sm mb-6">${error.message}</p>
                        <a href="dashboard.html" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition">
                            <i class="fas fa-arrow-left mr-2"></i>Retour au dashboard
                        </a>
                    </div>
                `;
            });
        });
    </script>

    <!-- Effets visuels légers -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => createFloatingHeart(), i * 300);
            }
            
            function createFloatingHeart() {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.className = 'floating-heart';
                heart.style.cssText = `
                    font-size: ${Math.random() * 20 + 15}px;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    animation: float-heart ${Math.random() * 10 + 5}s infinite ease-in-out;
                `;
                const app = document.getElementById('app');
                if (app) app.appendChild(heart);
            }
        });
    </script>
</body>
</html>
